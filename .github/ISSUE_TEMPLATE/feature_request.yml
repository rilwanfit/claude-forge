name: Feature request
description: Suggest a new feature or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What change do you suggest?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What other options did you consider?
