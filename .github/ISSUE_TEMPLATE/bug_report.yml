name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Say what you did, what you expected and what you saw.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the server with ...
        2. Open ...
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Operating system and Node.js version
      placeholder: macOS 15, Node 22.22.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove tokens, personal paths and session text before you paste.
      render: shell
