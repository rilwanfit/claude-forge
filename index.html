<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#151513" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)">
<title>Project dashboard</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-alert" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 4.8v3.9M8 11v.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-run" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.8-3.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M12.6 1.8v3h-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.2 8.2l2 2 3.6-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.8 5.8l4.4 4.4M10.2 5.8l-4.4 4.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-pause" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6.4 5.6v4.8M9.6 5.6v4.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-plug" viewBox="0 0 16 16"><path d="M6 2v3M10 2v3M4.5 5h7v2.5a3.5 3.5 0 0 1-7 0zM8 11v3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-chat" viewBox="0 0 16 16"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-clock" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 4.6V8l2.2 1.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <!-- task icons -->
    <symbol id="t-chart" viewBox="0 0 20 20"><path d="M3 16.5h14M5.5 13V9m4.5 4V5m4.5 8v-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="t-search" viewBox="0 0 20 20"><circle cx="9" cy="9" r="5.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M13 13l4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="t-write" viewBox="0 0 20 20"><path d="M4 16l.8-3.4L13.5 4a1.6 1.6 0 0 1 2.3 2.3l-8.7 8.6zM12 5.6l2.4 2.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></symbol>
    <symbol id="t-scan" viewBox="0 0 20 20"><path d="M3.5 7V4.5H6M14 4.5h2.5V7M16.5 13v2.5H14M6 15.5H3.5V13M6 10h8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="t-globe" viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3.6 10h12.8M10 3.4c2.2 2.2 2.2 11 0 13.2M10 3.4c-2.2 2.2-2.2 11 0 13.2" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
    <symbol id="t-play" viewBox="0 0 20 20"><path d="M7 4.8v10.4l8-5.2z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
  </defs>
</svg>
<div class="app">
  <aside class="side" aria-label="Projects"><nav id="side"></nav></aside>
  <main class="main" id="main" tabindex="-1">
    <header class="top">
      <div><h1 id="title">All projects</h1><p id="sub" class="sub"></p></div>
      <div class="top-actions">
        <a class="btn" href="/recap">Recap</a>
        <a class="btn" href="/usage">Usage</a>
        <button class="btn" id="notify" title="Desktop and phone alerts">Notifications</button>
        <button class="btn" id="refresh" title="Read sessions, git and GitHub now">Refresh</button>
        <button class="btn" id="ask">Ask</button>
        <button class="btn" id="new-wf">New workflow</button>
      </div>
    </header>
    <section id="strip" class="strip" aria-label="Schedule"></section>
    <div class="grid">
      <div class="runs" id="runs"></div>
      <section class="lib" id="lib" aria-label="Workflows"></section>
    </div>
  </main>
</div>
<div id="scrim" class="scrim" hidden></div>
<aside id="panel" class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" tabindex="-1" hidden></aside>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/app.js" type="module"></script>
</body>
</html>
